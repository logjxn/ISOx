name: Live mirror check

# distros.json encodes assumptions about directory layouts on servers nobody here
# controls, so it rots on its own schedule. This is the canary: it resolves every
# distro against its real mirrors weekly and files an issue when one stops
# working, so drift is found before a user hits it. No ISO is downloaded.
on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour on purpose - scheduled jobs on the hour
    # queue behind everyone else's cron and get delayed.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Resolve every distro against its real mirrors
        # shell: bash is what turns on pipefail. Without it the pipe into tee
        # would swallow pytest's exit code and this step would always pass.
        shell: bash
        run: pytest -m live -v -s 2>&1 | tee live.log

      - name: Report drift
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let log = '(no log captured)';
            try {
              log = fs.readFileSync('live.log', 'utf8');
            } catch (err) {
              core.warning(`Could not read live.log: ${err.message}`);
            }
            const tail = log.split('\n').slice(-100).join('\n');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The scheduled live mirror check failed, which usually means a distro',
              'moved its files, renamed an ISO, or published a variant that now matches',
              '`iso_filename_contains`. The fix is almost always a `distros.json` edit.',
              '',
              `Run: ${run}`,
              '',
              '<details><summary>pytest output</summary>',
              '',
              '```',
              tail,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { owner, repo } = context.repo;
            // One rolling issue, commented on each week, rather than a new one
            // every Monday until someone gets round to it.
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'mirror-drift',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: 'Live mirror check is failing',
                body,
                labels: ['mirror-drift'],
              });
            }
