name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Check formatting
        run: black --check .
      - name: Lint
        run: ruff check .
      - name: Security scan
        run: bandit isox.py
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Smoke test CLI
        run: python isox.py --list
      - name: Run tests
        run: pytest -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      # distros.json ships as a data file rather than package data, so an install
      # that silently dropped it would still import and only fail at runtime.
      - name: Install the wheel and run it from outside the repo
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/isox --list

      # A wheel's data files land wherever the install *scheme* puts them, which
      # is not sys.prefix for --user. Looking only there made `pip install --user`
      # produce a tool that couldn't find its own config and refused to start.
      - name: Install with --user and run it from outside the repo
        run: |
          export PYTHONUSERBASE=/tmp/userbase
          python -m pip install --user --no-warn-script-location dist/*.whl
          cd /tmp && "$PYTHONUSERBASE/bin/isox" --list
