name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fail if the tag doesn't match __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' isox.py)
          test "$tag" = "$pkg" || { echo "tag $tag != __version__ $pkg"; exit 1; }
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1